---
# macOS counterpart to playbook.yml (CachyOS/Arch).
#
# Prereqs (one time, on the Mac):
#   1. Install Homebrew: https://brew.sh  (also installs the Xcode Command Line Tools)
#   2. brew install ansible
#   3. ansible-galaxy collection install community.general
#   4. git clone https://github.com/MalariaKills/unix_dotfiles ~/.dotfiles
#
# Run:
#   cd ~/.dotfiles
#   ansible-playbook playbook-macos.yml -K                  # dotfiles + packages (workstation)
#   ansible-playbook playbook-macos.yml -K --tags all,server # ...plus the always-on server setup
#
# Tags match playbook.yml:
#   --tags config        only copy dotfiles and sync LazyVim
#   --tags packages      only install Homebrew formulae and casks
#   --skip-tags system   skip package installs and system settings
#   --tags server        ONLY the headless-server settings (never runs unless asked)
#
# Remote (from the MacBook control node): put the Mac mini in your inventory and
# drop `hosts: localhost` / `connection: local` in favor of `hosts: macmini`.

- name: Set up unix_dotfiles (macOS)
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    dotfiles_home: "{{ ansible_env.HOME }}"
    brew_prefix: "{{ '/opt/homebrew' if ansible_architecture == 'arm64' else '/usr/local' }}"

    # Same CLI toolset as the Arch playbook. zsh is the macOS default shell and
    # base-devel/unzip are covered by the Xcode CLT, so they're not listed.
    brew_formulae:
      - fastfetch
      - neovim
      - git
      - eza
      - bat
      - fzf
      - zoxide
      - ripgrep
      - fd

    brew_casks:
      - ghostty
      - font-jetbrains-mono-nerd-font

    # Extra packages for the self-hosting Mac mini (installed only with --tags server).
    # OrbStack replaces Docker Desktop. Odysseus serves models itself through a
    # Metal-enabled llama.cpp (installed by its start-macos.sh), so no Ollama.
    server_formulae:
      - tmux
    server_casks:
      - orbstack

  pre_tasks:
    - name: Make sure this is macOS
      ansible.builtin.assert:
        that: ansible_os_family == "Darwin"
        fail_msg: "This playbook is for macOS. Use playbook.yml on CachyOS/Arch."
      tags: [always]

    - name: Make sure Homebrew is installed
      ansible.builtin.stat:
        path: "{{ brew_prefix }}/bin/brew"
      register: brew_bin
      tags: [always]

    - name: Stop if Homebrew is missing
      ansible.builtin.fail:
        msg: "Homebrew not found at {{ brew_prefix }}. Install it from https://brew.sh first."
      when: not brew_bin.stat.exists
      tags: [always]

  tasks:
    # ---------------------------------------------------------------- packages
    - name: Install Homebrew formulae
      community.general.homebrew:
        name: "{{ brew_formulae }}"
        state: present
        update_homebrew: true
      tags: [system, packages]

    - name: Install Homebrew casks
      community.general.homebrew_cask:
        name: "{{ brew_casks }}"
        state: present
      tags: [system, packages]

    # ---------------------------------------------------------------- shell
    # macOS already uses /bin/zsh as the login shell; only fix it if it was changed.
    - name: Read current login shell
      ansible.builtin.command: dscl . -read "/Users/{{ ansible_user_id }}" UserShell
      register: current_shell
      changed_when: false
      tags: [system, shell]

    - name: Set zsh as login shell
      become: true
      ansible.builtin.command: chsh -s /bin/zsh "{{ ansible_user_id }}"
      when: "'/bin/zsh' not in current_shell.stdout"
      tags: [system, shell]

    # ---------------------------------------------------------------- config
    - name: Create config directories
      ansible.builtin.file:
        path: "{{ dotfiles_home }}/.config/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - ghostty
        - fastfetch
        - nvim
      tags: [config]

    # .zshrc already handles /opt/homebrew via `brew shellenv`, so it's shared as-is.
    - name: Copy zsh config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/zsh/.zshrc"
        dest: "{{ dotfiles_home }}/.zshrc"
        mode: "0644"
      tags: [config]

    - name: Copy ghostty config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/ghostty/config"
        dest: "{{ dotfiles_home }}/.config/ghostty/config"
        mode: "0644"
      tags: [config]

    - name: Copy fastfetch config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/fastfetch/config.jsonc"
        dest: "{{ dotfiles_home }}/.config/fastfetch/config.jsonc"
        mode: "0644"
      tags: [config]

    # The shared config uses the CachyOS logo; swap in the macOS one on this side only.
    - name: Use the macOS logo in fastfetch
      ansible.builtin.replace:
        path: "{{ dotfiles_home }}/.config/fastfetch/config.jsonc"
        regexp: '"source":\s*"CachyOS_small"'
        replace: '"source": "macos_small"'
      tags: [config]

    - name: Copy neovim (LazyVim) config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/nvim/"
        dest: "{{ dotfiles_home }}/.config/nvim/"
      tags: [config]

    - name: Install LazyVim plugins
      ansible.builtin.command:
        argv:
          - "{{ brew_prefix }}/bin/nvim"
          - --headless
          - "+Lazy! sync"
          - +qa
        creates: "{{ dotfiles_home }}/.local/share/nvim/lazy/lazy.nvim"
      environment:
        HOME: "{{ dotfiles_home }}"
      tags: [config]

    # ---------------------------------------------------------------- server
    # Everything below is tagged `never`, so it only runs with --tags server.
    - name: Install server formulae
      community.general.homebrew:
        name: "{{ server_formulae }}"
        state: present
      tags: [never, server]

    - name: Install server casks
      community.general.homebrew_cask:
        name: "{{ server_casks }}"
        state: present
      tags: [never, server]

    # Never sleep, restart after a power failure, wake on network access.
    # Display sleep is left alone; it saves power and doesn't affect services.
    - name: Read power settings
      ansible.builtin.command: pmset -g custom
      register: pmset_now
      changed_when: false
      tags: [never, server]

    - name: Set server power settings
      become: true
      ansible.builtin.command: pmset -a sleep 0 disksleep 0 autorestart 1 womp 1
      when: >-
        pmset_now.stdout is not search('\n\s*sleep\s+0\b') or
        pmset_now.stdout is not search('\n\s*disksleep\s+0\b') or
        pmset_now.stdout is not search('\n\s*autorestart\s+1\b') or
        pmset_now.stdout is not search('\n\s*womp\s+1\b')
      tags: [never, server]

    - name: Restart automatically if the system freezes
      become: true
      ansible.builtin.command: systemsetup -setrestartfreeze on
      changed_when: false
      tags: [never, server]

    - name: Turn off sending crash and usage analytics to Apple
      become: true
      community.general.osx_defaults:
        domain: /Library/Application Support/CrashReporter/DiagnosticMessagesHistory.plist
        key: AutoSubmit
        type: bool
        value: false
      tags: [never, server]

    - name: Don't open apps from the last session after a reboot
      community.general.osx_defaults:
        domain: com.apple.loginwindow
        key: TALLogoutSavesState
        type: bool
        value: false
      tags: [never, server]
